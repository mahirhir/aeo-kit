name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core only; headroom is an optional extra)
        run: pip install -e .
      - name: Deterministic audit (HARD checks must all pass)
        run: python audit.py
      - name: End-to-end smoke run
        run: python experiment.py
